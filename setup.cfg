# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = nwp500-python
description = A library for controlling Navien NWP500 Water Heaters via NaviLink
author = Emmanuel Levijarvi
author_email = emansl@gmail.com
license = MIT
license_files = LICENSE.txt
long_description = file: README.rst
long_description_content_type = text/x-rst; charset=UTF-8
url = https://github.com/eman/nwp500-python
# Add here related links, for example:
project_urls =
    Documentation = https://nwp500-python.readthedocs.io/en/latest/
    Source = https://github.com/eman/nwp500-python
#    Changelog = https://pyscaffold.org/en/latest/changelog.html
    Tracker = https://github.com/eman/nwp500-python/issues
#    Conda-Forge = https://anaconda.org/conda-forge/pyscaffold
#    Download = https://pypi.org/project/PyScaffold/#files
#    Twitter = https://twitter.com/PyScaffold

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3 :: Only


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.14

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    aiohttp>=3.13.5
    awsiotsdk>=1.29.0
    pydantic>=2.0.0


[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install nwp500-python[PDF]` like:
# PDF = ReportLab; RXP

# CLI - command line interface with optional rich formatting
cli =
    click>=8.3.0
    rich>=14.3.0

# Bluetooth LE access to the heater's controller (installer data)
ble =
    bleak>=0.22.0

# sim - the optional heater simulator (nwp500.sim)
sim =
    numpy>=1.24.0
    pandas>=2.0.0
    scipy>=1.11.0

# Add here test requirements (semicolon/line-separated)
testing =
    %(sim)s
    setuptools
    pytest
    pytest-cov
    pytest-asyncio
    hypothesis

# Development tools
dev =
    ruff>=0.1.0
    pyright>=1.1.0
    %(testing)s

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = nwp500.module:function
# For example:
console_scripts =
     nwp-cli = nwp500.cli.__main__:run
# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov nwp500 --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
# NOTE: This is the PyScaffold TOOL version, NOT the package version!
# Package version is managed by setuptools_scm from git tags.
version = 4.6
package = nwp500

[importlinter]
root_package = nwp500
include_external_packages = True

[importlinter:contract:sim-no-io]
name = The simulator core does no I/O and does not log
type = forbidden
source_modules =
    nwp500.sim
forbidden_modules =
    nwp500.mqtt
    nwp500.api_client
    nwp500.auth
    nwp500.sim_adapters
    nwp500.sim_live
    nwp500.sim_home_assistant
    aiohttp
    awscrt
    awsiot
    logging

[importlinter:contract:calibrate-no-cli]
name = An application calibrates without the CLI's dependencies
type = forbidden
source_modules =
    nwp500.sim_calibrate
forbidden_modules =
    nwp500.cli
    click
    rich

[importlinter:contract:ble-optional]
name = Only nwp500.ble imports bleak, and only nwp-cli's ble backend imports nwp500.ble
type = forbidden
source_modules =
    nwp500._base
    nwp500.api_client
    nwp500.auth
    nwp500.cli
    nwp500.command_decorators
    nwp500.config
    nwp500.converters
    nwp500.device_capabilities
    nwp500.device_info_cache
    nwp500.encoding
    nwp500.enums
    nwp500.events
    nwp500.exceptions
    nwp500.factory
    nwp500.field_factory
    nwp500.models
    nwp500.mqtt
    nwp500.mqtt_events
    nwp500.openei
    nwp500.reservations
    nwp500.sim
    nwp500.sim_adapters
    nwp500.sim_calibrate
    nwp500.sim_home_assistant
    nwp500.sim_live
    nwp500.status_history
    nwp500.temperature
    nwp500.topic_builder
    nwp500.tou_schedule
    nwp500.unit_system
    nwp500.utils
forbidden_modules =
    nwp500.ble
    bleak
ignore_imports =
    # nwp-cli --backend ble, imported only when that backend is chosen
    nwp500.cli.ble_backend -> nwp500.ble
