# Configuration for the tools that still read setup.cfg. The package's
# metadata is in pyproject.toml.

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov nwp500 --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
# NOTE: This is the PyScaffold TOOL version, NOT the package version!
# Package version is managed by setuptools_scm from git tags.
version = 4.6
package = nwp500

[importlinter]
root_package = nwp500
include_external_packages = True

[importlinter:contract:sim-no-io]
name = The simulator core does no I/O and does not log
type = forbidden
source_modules =
    nwp500.sim
forbidden_modules =
    nwp500.mqtt
    nwp500.api_client
    nwp500.auth
    nwp500.sim_adapters
    nwp500.sim_live
    nwp500.sim_home_assistant
    aiohttp
    awscrt
    awsiot
    logging

[importlinter:contract:calibrate-no-cli]
name = An application calibrates without the CLI's dependencies
type = forbidden
source_modules =
    nwp500.sim_calibrate
forbidden_modules =
    nwp500.cli
    click
    rich

[importlinter:contract:ble-optional]
name = Only nwp500.ble imports bleak, and only nwp-cli's ble backend imports nwp500.ble
type = forbidden
source_modules =
    nwp500._base
    nwp500.api_client
    nwp500.auth
    nwp500.cli
    nwp500.command_decorators
    nwp500.config
    nwp500.converters
    nwp500.device_capabilities
    nwp500.device_info_cache
    nwp500.encoding
    nwp500.enums
    nwp500.events
    nwp500.exceptions
    nwp500.factory
    nwp500.field_factory
    nwp500.models
    nwp500.mqtt
    nwp500.mqtt_events
    nwp500.openei
    nwp500.reservations
    nwp500.sim
    nwp500.sim_adapters
    nwp500.sim_calibrate
    nwp500.sim_home_assistant
    nwp500.sim_live
    nwp500.status_history
    nwp500.temperature
    nwp500.topic_builder
    nwp500.tou_schedule
    nwp500.unit_system
    nwp500.utils
forbidden_modules =
    nwp500.ble
    bleak
ignore_imports =
    # nwp-cli --backend ble, imported only when that backend is chosen
    nwp500.cli.ble_backend -> nwp500.ble
