[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nwp500-python"
description = "A library for controlling Navien NWP500 Water Heaters via NaviLink"
readme = { file = "README.rst", content-type = "text/x-rst; charset=UTF-8" }
authors = [{ name = "Emmanuel Levijarvi", email = "emansl@gmail.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
# The version comes from the git tag (setuptools_scm).
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.13.5",
    "awsiotsdk>=1.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Command line interface with optional rich formatting
cli = [
    "click>=8.3.0",
    "rich>=14.3.0",
]
# Bluetooth LE access to the heater's controller (installer data)
ble = [
    "bleak>=0.22.0",
]
# The optional heater simulator (nwp500.sim)
sim = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]
testing = [
    "nwp500-python[sim]",
    "setuptools",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "hypothesis",
]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "nwp500-python[testing]",
]

[project.scripts]
nwp-cli = "nwp500.cli.__main__:run"

[project.urls]
Homepage = "https://github.com/eman/nwp500-python"
Documentation = "https://nwp500-python.readthedocs.io/en/latest/"
Source = "https://github.com/eman/nwp500-python"
Tracker = "https://github.com/eman/nwp500-python/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]
namespaces = true

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

[tool.ruff]
# Ruff configuration for code formatting and linting
line-length = 80
target-version = "py314"

# Exclude directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docs/conf.py",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Add other rules as needed:
# - isort (I) for import sorting
# - pyupgrade (UP) for Python version upgrade suggestions
# - flake8-bugbear (B) for common bugs
# - flake8-comprehensions (C4) for comprehension improvements
# - flake8-simplify (SIM) for simplification suggestions
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
    "RUF",   # Ruff-specific rules (incl. unused noqa)
    "DTZ",   # flake8-datetimez (naive datetime usage)
    "PTH",   # flake8-use-pathlib
    "ASYNC", # flake8-async
    "PERF",  # perflint
]

ignore = [
    "E203",  # whitespace before ':' (conflicts with black/ruff format)
    "B904",  # raise from - will be addressed in a future update
    # Async functions taking a `timeout:` parameter are a deliberate,
    # documented public API of this library (e.g. wait_for, command
    # helpers); switching callers to asyncio.timeout() would be a
    # breaking change with no behavioral benefit.
    "ASYNC109",
    # Degree signs, en-dashes, and multiplication signs in docstrings
    # and user-facing strings are intentional (temperature units,
    # ranges), not typos of ASCII look-alikes.
    "RUF001",
    "RUF002",
    "RUF003",
    # __all__ lists are deliberately grouped by category with comments,
    # not sorted alphabetically.
    "RUF022",
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore import rules in __init__.py files
"__init__.py" = ["F401", "F403"]
# Ignore rules in test files
"tests/**/*.py" = ["B", "SIM", "S101", "S105", "S106", "S110"]  # S101: assert; S105/S106: credentials; S110: bare except
# Ignore import order in examples (they need to modify sys.path first)
"examples/**/*.py" = ["E402", "S105", "S106"]  # S105/S106: example mock credentials
# Ignore assert_used in CLI rich output (acceptable for non-library code)
"src/nwp500/cli/rich_output.py" = ["S101"]
# The simulator is a port that must stay bit-identical to the engine it
# came from: its asserts state invariants, and its defaults are frozen
# dataclass instances, so neither is rewritten to satisfy a lint.
"src/nwp500/sim/**/*.py" = ["S101", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["nwp500"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

[tool.mypy]
# Enable strict mode for comprehensive type checking
strict = true

# Python version target
python_version = "3.14"

# Module discovery
files = ["src/nwp500", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Import discovery
follow_imports = "normal"
ignore_missing_imports = false

# Platform configuration
platform = "linux"

# Warnings
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

# Error reporting
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true

# Incremental mode
incremental = true
cache_dir = ".mypy_cache"

# Per-module overrides
[[tool.mypy.overrides]]
module = "awscrt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "awsiot.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bleak.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nwp500.cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pyright]
# Pyright configuration for strict type checking
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src/nwp500", "tests"]
exclude = [".venv", "build", "dist", ".tox"]

# Strict error reporting
reportGeneralTypeIssues = "error"
reportUnboundVariable = "error"
reportUnusedImport = "error"
reportUnsupportedDunderAll = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportOptionalCall = "error"
reportUnnecessaryComparison = "error"
reportPossiblyUnboundVariable = "error"
reportUnnecessaryIsInstance = "error"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"

# Type stub warnings
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportMissingParameterType = "warning"
reportPrivateImportUsage = "warning"

# Untyped decorators and base classes from third-party libraries (Click, Pydantic)
# These libraries don't have complete type stubs, so we report these as warnings
reportUntypedFunctionDecorator = "warning"
reportUntypedBaseClass = "warning"

# Ignore missing imports for external libraries without stubs
reportMissingImports = false

# Tests reach into the modules they test.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
