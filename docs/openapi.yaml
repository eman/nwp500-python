
openapi: 3.1.0
info:
  title: Navien Smart Control API
  description: |
    OpenAPI specification for the Navien Smart Control REST API.

    ## Authentication

    The API uses JWT for authentication. The following steps are required to authenticate:

    1.  **Sign-In**: Send a `POST` request to `/user/sign-in` with the user's email and password.
    2.  **Receive Tokens**: The server returns an `idToken`, `accessToken`, and `refreshToken`.
    3.  **Authorize Requests**: Include the `accessToken` in the `Authorization` header of subsequent requests as a Bearer token.
    4.  **Refresh Token**: When the `accessToken` expires, send a `POST` request to `/auth/refresh` with the `refreshToken` to obtain a new set of tokens.
  version: 2.1.0
servers:
  - url: https://nlus.naviensmartcontrol.com/api/v2.1
security:
  - bearerAuth: []
paths:
  /user/sign-in:
    post:
      summary: User Sign-In
      description: Authenticates the user and returns tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: "password"
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
  /user/secured-sign-in:
    post:
      summary: Secured Sign-In
      description: |
        Re-authenticates with an existing access token instead of a password
        and returns a full sign-in response (user info, JWT tokens and AWS
        credentials). The NaviLink app uses it to restore a session without
        prompting for credentials. The access token goes in the
        `Authorization` header as on every other authenticated call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: user@example.com
      responses:
        '200':
          description: >-
            Successful authentication. Same envelope as /user/sign-in, but the
            `token` object has been observed to carry only the AWS credential
            fields (accessKeyId, secretKey, sessionToken,
            authorizationExpiresIn); clients keep any JWT fields not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
  /auth/session/refresh:
    post:
      summary: Refresh AWS Session Credentials
      description: |
        Issues fresh AWS (MQTT) session credentials for the signed-in user
        without rotating the JWT tokens. The access token goes in the
        `Authorization` header. Every field of `data` is optional; the
        NaviLink app only stores the ones present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: user@example.com
      responses:
        '200':
          description: New AWS session credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      accessKeyId:
                        type: string
                      secretKey:
                        type: string
                      sessionToken:
                        type: string
                      authorizationExpiresIn:
                        type: integer
                        example: 3600
  /auth/refresh:
    post:
      summary: Refresh Token
      description: Refreshes the access token using a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Successful token refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      idToken:
                        type: string
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      authenticationExpiresIn:
                        type: integer
                        example: 3600
  /device/list:
    post:
      summary: List Devices
      description: Retrieves a list of devices associated with the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offset:
                  type: integer
                  example: 0
                count:
                  type: integer
                  example: 20
                userId:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Push token updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceInfo:
                          type: object
                          properties:
                            homeSeq:
                              type: integer
                              example: 25004
                            macAddress:
                              type: string
                              example: "04786332fca0"
                            additionalValue:
                              type: string
                              example: "5322"
                            deviceType:
                              type: integer
                              example: 52
                            deviceName:
                              type: string
                              example: "NWP500"
                            connected:
                              type: integer
                              example: 2
                            modelTypeCode:
                              type: [integer, "null"]
                              example: null
                            installerId:
                              type: [string, "null"]
                              example: null
                        location:
                          type: object
                          properties:
                            state:
                              type: string
                              example: "California"
                            city:
                              type: string
                              example: "Anytown"
                            address:
                              type: string
                              example: "123 Main Street"
                        error:
                          type: object
                          description: Last recorded device fault.
                          properties:
                            errorCode:
                              type: [integer, "null"]
                              example: 0
                            errorOccuredTime:
                              type: [string, "null"]
                              example: "2025-12-07T11:58:02"
                        descaling:
                          type: object
                          properties:
                            descalingStartTime:
                              type: [string, "null"]
                              example: null
                            descalingEndTime:
                              type: [string, "null"]
                              example: null
  /device/info:
    post:
      summary: Device Info
      description: Retrieves information about a specific device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                macAddress:
                  type: string
                  example: "0123456789ab"
                additionalValue:
                  type: string
                  example: "5322"
                userId:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      deviceInfo:
                        type: object
                        properties:
                          homeSeq:
                            type: integer
                            example: 25004
                          deviceName:
                            type: string
                            example: "NWP500"
                          deviceType:
                            type: integer
                            example: 52
                          installType:
                            type: string
                            example: "R"
                          connected:
                            type: integer
                            example: 2
                      location:
                        type: object
                        properties:
                          state:
                            type: string
                            example: "California"
                          city:
                            type: string
                            example: "Anytown"
                          address:
                            type: string
                            example: "123 Main Street"
                          latitude:
                            type: number
                            example: 34.052235
                          longitude:
                            type: number
                            example: -118.243683
                          altitude:
                            type: [object, "null"]
                      installer:
                        type: object
                        description: Installer linked to the device; every field null when there is none.
                        properties:
                          installerId:
                            type: [string, "null"]
                          installerFirstName:
                            type: [string, "null"]
                          installerLastName:
                            type: [string, "null"]
                          installerPhoneNumber:
                            type: [string, "null"]
                      alarmInfo:
                        $ref: '#/components/schemas/PushSettings'
                      descaling:
                        type: object
                        properties:
                          descalingStartTime:
                            type: [object, "null"]
                          descalingEndTime:
                            type: [object, "null"]
  /device/firmware/info:
    post:
      summary: Firmware Info
      description: Retrieves firmware information for a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                macAddress:
                  type: string
                  example: "0123456789ab"
                additionalValue:
                  type: string
                  example: "5322"
                userId:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Firmware information
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      firmwares:
                        type: array
                        items:
                          type: object
                          properties:
                            macAddress:
                              type: string
                              example: "04786332fca0"
                            additionalValue:
                              type: string
                              example: "5322"
                            deviceType:
                              type: integer
                              example: 52
                            deviceGroup:
                              type: [object, "null"]
                              description: Null for a stand-alone unit.
                              properties:
                                groupSeq:
                                  type: integer
                                unitNum:
                                  type: integer
                            deviceGroupUnitNo:
                              type: integer
                              description: Unit number within the group; the app reads this and deviceGroup.unitNum.
                            curSwCode:
                              type: integer
                              example: 33556241
                            curVersion:
                              type: integer
                              example: 167837696
                            downloadedVersion:
                              type: [integer, "null"]
                              example: 0
  /device/tou:
    get:
      summary: Get Time of Use Settings
      description: |
        Retrieves Time of Use (TOU) pricing information for a device. This endpoint returns
        both utility rate information and device-specific TOU schedules for demand response optimization.
        
        The response includes pricing schedules with time periods, days of week, and seasonal variations.
        Prices are represented as integers scaled by the decimalPoint field (divide by 10^decimalPoint).
      parameters:
        - name: additionalValue
          in: query
          required: true
          schema:
            type: string
          example: "5322"
          description: Additional device identifier
        - name: controllerId
          in: query
          required: true
          schema:
            type: string
          example: "56496061BT22230408"
          description: Controller serial number
        - name: macAddress
          in: query
          required: true
          schema:
            type: string
          example: "04786332fca0"
          description: Device MAC address
        - name: userId
          in: query
          required: true
          schema:
            type: string
          example: "user@example.com"
          description: User email address
        - name: userType
          in: query
          required: true
          schema:
            type: string
          example: "O"
          description: User type (O = Owner)
      responses:
        '200':
          description: Time of Use information
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      registerPath:
                        type: string
                        example: "bt"
                      sourceType:
                        type: string
                        example: "openei"
                      touInfo:
                        type: object
                        properties:
                          controllerId:
                            type: string
                            example: "56496061BT22230408"
                          manufactureId:
                            type: string
                            example: "6760E2532669023"
                          name:
                            type: string
                            example: "E-TOU-C Residential Time of Use Baseline Region V (All Electric Service)"
                          schedule:
                            type: array
                            items:
                              type: object
                              properties:
                                season:
                                  type: integer
                                  example: 3615
                                  description: Season identifier bitfield for when this schedule applies
                                interval:
                                  type: array
                                  description: Array of time periods with pricing information
                                  items:
                                    type: object
                                    properties:
                                      priceMin:
                                        type: integer
                                        example: 36261
                                        description: Minimum price (divide by 10^decimalPoint for actual price)
                                      endHour:
                                        type: integer
                                        example: 15
                                        description: End hour for this pricing period (0-23)
                                      priceMax:
                                        type: integer
                                        example: 46378
                                        description: Maximum price (divide by 10^decimalPoint for actual price)
                                      week:
                                        type: integer
                                        example: 62
                                        description: Days of week bitfield (62=weekdays [Mon–Fri], 65=weekend [Sat+Sun], 127=all days; Sunday=1, Monday=2, ..., Saturday=64)
                                      decimalPoint:
                                        type: integer
                                        example: 5
                                        description: Decimal places for price calculation (e.g., 5 means divide by 100000)
                                      startHour:
                                        type: integer
                                        example: 0
                                        description: Start hour for this pricing period (0-23)
                                      startMinute:
                                        type: integer
                                        example: 0
                                        description: Start minute (0-59)
                                      endMinute:
                                        type: integer
                                        example: 59
                                        description: End minute (0-59)
                          utility:
                            type: string
                            example: "Pacific Gas & Electric Co"
                          zipCode:
                            type: integer
                            example: 94595
    put:
      summary: Apply TOU Rate Plan
      description: |
        Applies a Time of Use rate plan to a device. The request includes the converted
        TOU schedule (from POST /device/tou/convert), the original source data from OpenEI,
        and device identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - additionalValue
                - macAddress
                - sourceData
                - sourceType
                - touInfo
                - userId
                - userType
                - zipCode
              properties:
                additionalValue:
                  type: string
                  example: "5322"
                macAddress:
                  type: string
                  example: "04786332fca0"
                registerPath:
                  type: string
                  example: "wifi"
                  description: Device connection type (wifi or bt)
                sourceData:
                  type: object
                  description: Original OpenEI rate plan object
                sourceType:
                  type: string
                  example: "openei"
                touInfo:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Electric Vehicle EV (Sch) Rate A"
                    schedule:
                      type: array
                      items:
                        type: object
                        properties:
                          season:
                            type: integer
                          interval:
                            type: array
                            items:
                              $ref: '#/components/schemas/TOUInterval'
                    utility:
                      type: string
                      example: "Pacific Gas & Electric Co"
                    zipCode:
                      type: string
                      example: "94903"
                userId:
                  type: string
                  example: "user@example.com"
                userType:
                  type: string
                  example: "O"
                zipCode:
                  type: string
                  example: "94903"
      responses:
        '200':
          description: Rate plan applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      sourceType:
                        type: string
                        example: "openei"
                      touInfo:
                        type: object
                        properties:
                          name:
                            type: string
                          schedule:
                            type: array
                            items:
                              type: object
                              properties:
                                season:
                                  type: integer
                                interval:
                                  type: array
                                  items:
                                    $ref: '#/components/schemas/TOUInterval'
                          utility:
                            type: string
                          zipCode:
                            type: integer
                          controllerId:
                            type: string
    delete:
      summary: Remove TOU Rate Plan
      description: |
        Removes the TOU rate plan from a device. The NaviLink app serialises
        the same request object it sends to PUT and appends it to the URL as
        a query string (a DELETE carries no body). It sends `controllerId`
        for a plan registered over Bluetooth (`registerPath` = `bt`) and
        `macAddress`/`additionalValue` otherwise.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          example: "user@example.com"
        - name: userType
          in: query
          required: true
          schema:
            type: string
          example: "O"
        - name: registerPath
          in: query
          schema:
            type: string
          example: "wifi"
          description: wifi or bt
        - name: sourceType
          in: query
          schema:
            type: string
          example: "openei"
        - name: macAddress
          in: query
          schema:
            type: string
          example: "04786332fca0"
          description: WiFi-registered plan
        - name: additionalValue
          in: query
          schema:
            type: string
          example: "5322"
          description: WiFi-registered plan
        - name: controllerId
          in: query
          schema:
            type: string
          example: "56496061BT22230408"
          description: Bluetooth-registered plan
      responses:
        '200':
          description: Rate plan removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /device/tou/manufacture-id:
    get:
      summary: Get Manufacture ID
      description: |
        Returns the manufacture ID the TOU service holds for a device. The
        NaviLink app treats `"000000000000000"` as not available. The app
        serialises its request object and appends it as a query string.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          example: "user@example.com"
        - name: macAddress
          in: query
          required: true
          schema:
            type: string
          example: "04786332fca0"
        - name: additionalValue
          in: query
          required: true
          schema:
            type: string
          example: "5322"
        - name: controllerId
          in: query
          required: true
          schema:
            type: string
          example: "56496061BT22230408"
      responses:
        '200':
          description: Manufacture ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      manufactureId:
                        type: string
                        example: "6760E2532669023"
  /device/tou/convert:
    post:
      summary: Convert OpenEI Rate Plans to Device Format
      description: |
        Converts raw OpenEI rate plan data into the device-ready TOU format with
        season bitfields, week bitfields, and scaled pricing. This endpoint handles
        the complex conversion logic server-side.

        Send all rate plan items from an OpenEI API response and receive back the
        converted schedules ready for use with PUT /device/tou.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceData
                - sourceType
                - sourceVersion
                - userId
                - userType
              properties:
                sourceData:
                  type: array
                  description: Array of OpenEI rate plan objects
                  items:
                    type: object
                sourceType:
                  type: string
                  example: "openei"
                sourceVersion:
                  type: integer
                  example: 7
                userId:
                  type: string
                  example: "user@example.com"
                userType:
                  type: string
                  example: "O"
      responses:
        '200':
          description: Converted rate plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      touInfo:
                        type: array
                        items:
                          type: object
                          properties:
                            utility:
                              type: string
                              example: "Pacific Gas & Electric Co"
                            name:
                              type: string
                              example: "Electric Vehicle EV (Sch) Rate A"
                            schedule:
                              type: array
                              items:
                                type: object
                                properties:
                                  season:
                                    type: integer
                                    example: 3087
                                    description: Season bitfield
                                  interval:
                                    type: array
                                    items:
                                      $ref: '#/components/schemas/TOUInterval'
  /app/update-push-token:
    post:
      summary: Update Push Token
      description: Updates the push notification token for the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modelName:
                  type: string
                appVersion:
                  type: string
                os:
                  type: string
                osVersion:
                  type: string
                userId:
                  type: string
                pushToken:
                  type: string
      responses:
        '200':
          description: Push token updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /app/version:
    post:
      summary: App Version Check
      description: |
        Latest and minimum supported NaviLink app versions. Called by the
        app's splash screen before sign-in, so it sends no `Authorization`
        header. When the backend is down for maintenance it answers 403
        with `data.serverCheckText` carrying the notice to display.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                os:
                  type: string
                  example: "A"
                  description: Platform; the app sends "A" (Android)
      responses:
        '200':
          description: App versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      appVersion:
                        type: string
                        example: "2.04.00"
                      appForceVersion:
                        type: string
                        example: "2.00.00"
        '403':
          description: Backend under maintenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 403
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      serverCheckText:
                        type: string
                        description: Maintenance notice; literal "\n" sequences mark line breaks.
  /user/info:
    post:
      summary: User Profile
      description: |
        The signed-in user's profile: the sign-in response's `userInfo`
        plus phone number and e-mail. The app treats a null `userLastName`
        as an empty string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      userType:
                        type: string
                        example: "O"
                      userFirstName:
                        type: string
                        example: "Jane"
                      userLastName:
                        type: [string, "null"]
                      userPhoneNumber:
                        type: [string, "null"]
                        example: "5551234"
                      userSeq:
                        type: integer
                        example: 36283
                      userEmail:
                        type: string
                        example: "user@example.com"
  /user/get-push-settings:
    post:
      summary: Get Push Settings
      description: |
        Which push notifications are enabled for one device. Flags are
        **1 = on, 2 = off** (the app sends `isChecked() ? 1 : 2`), the
        reverse of the device's own on/off flags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeviceRequest'
      responses:
        '200':
          description: Push settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    $ref: '#/components/schemas/PushSettings'
  /user/set-push-settings:
    post:
      summary: Set Push Settings
      description: |
        Enables or disables push notifications for one device. Any flag
        may be omitted; the app leaves `isDescalingAlarm` out for a member
        account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UserDeviceRequest'
                - $ref: '#/components/schemas/PushSettings'
      responses:
        '200':
          description: Push settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /device/change-info:
    post:
      summary: Update Device Info
      description: |
        Renames a device or updates its installation type and location.
        The app omits `installType` when empty, omits `location` unless at
        least one of state/city/address is set, and inside it leaves out
        empty strings and zero coordinates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, deviceInfo]
              properties:
                userId:
                  type: string
                  example: "user@example.com"
                deviceInfo:
                  type: object
                  required: [macAddress, additionalValue, deviceType, deviceName]
                  properties:
                    macAddress:
                      type: string
                      example: "04786332fca0"
                    additionalValue:
                      type: string
                      example: "5322"
                    deviceType:
                      type: integer
                      example: 52
                    deviceName:
                      type: string
                      example: "Garage Heater"
                    installType:
                      type: string
                      example: "R"
                location:
                  type: object
                  properties:
                    state:
                      type: string
                    city:
                      type: string
                    address:
                      type: string
                    latitude:
                      type: number
                    longitude:
                      type: number
                    altitude:
                      type: number
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /device/simple-list:
    post:
      summary: Simple Device List
      description: |
        A trimmed device list. The app sends `targetUserId` equal to the
        signed-in user for its product-management screen, and an owner's ID
        when an installer views that owner's devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, targetUserId, offset, count]
              properties:
                userId:
                  type: string
                  example: "user@example.com"
                targetUserId:
                  type: string
                  example: "user@example.com"
                offset:
                  type: integer
                  example: 0
                count:
                  type: integer
                  example: 20
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        macAddress:
                          type: string
                          example: "04786332fca0"
                        additionalValue:
                          type: string
                          example: "5322"
                        deviceType:
                          type: integer
                          example: 52
                        modelTypeCode:
                          type: [integer, "null"]
                        deviceName:
                          type: string
                          example: "NWP500"
  /device/error/list:
    post:
      summary: Device Error History
      description: |
        Faults the cloud has recorded for a device. The app calls this only
        from its installer error-list screen and sends the signed-in user's
        ID as `installerId`; whether an owner's ID is accepted is untested.
        Pages are keyed by the last entry's `errorOccuredTime`, sent back as
        `continuousKey` (omitted on the first page).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installerId, macAddress, additionalValue, count]
              properties:
                installerId:
                  type: string
                  example: "installer@example.com"
                macAddress:
                  type: string
                  example: "04786332fca0"
                additionalValue:
                  type: string
                  example: "5322"
                continuousKey:
                  type: integer
                  format: int64
                  example: 1733572682000
                  description: errorOccuredTime of the last entry of the previous page
                count:
                  type: integer
                  example: 20
      responses:
        '200':
          description: Error history
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      timeZone:
                        type: string
                        example: "America/Los_Angeles"
                      errorInfo:
                        type: array
                        items:
                          type: object
                          properties:
                            channelNumber:
                              type: integer
                              example: 1
                            unitType:
                              type: integer
                              example: 1
                            errorCode:
                              type: integer
                              example: 96
                            subError:
                              type: integer
                              example: 0
                            errorOccuredTime:
                              type: integer
                              format: int64
                              example: 1733572682000
                              description: Epoch milliseconds
  /device/filter/change-info:
    post:
      summary: Record Air Filter Replacement
      description: Records the date the air filter was replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceDateRequest'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /device/cip/change-info:
    post:
      summary: Record CIP Service
      description: Records the date a CIP (clean-in-place / descaling) service was done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceDateRequest'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /device/filter/history:
    post:
      summary: Air Filter Replacement History
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceHistoryRequest'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceHistoryResponse'
  /device/cip/history:
    post:
      summary: CIP Service History
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceHistoryRequest'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceHistoryResponse'
  /device/preferences/format:
    get:
      summary: Get Display Preferences
      description: |
        Unit display preferences stored for a device. The app serialises its
        request object and appends it to the URL as a query string, and uses
        the first entry of the returned list.
      parameters:
        - name: macAddress
          in: query
          required: true
          schema:
            type: string
          example: "04786332fca0"
        - name: additionalValue
          in: query
          required: true
          schema:
            type: string
          example: "5322"
        - name: modelTypeCode
          in: query
          schema:
            type: integer
          example: 1
          description: From the device feature; omitted when unknown
      responses:
        '200':
          description: Display preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisplayPreferences'
    post:
      summary: Set Display Preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [macAddress, additionalValue]
                  properties:
                    macAddress:
                      type: string
                      example: "04786332fca0"
                    additionalValue:
                      type: string
                      example: "5322"
                - $ref: '#/components/schemas/DisplayPreferences'
      responses:
        '200':
          description: Preferences stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
  /firmware/info:
    post:
      summary: Firmware Image Detail
      description: |
        Describes one firmware image by the `curSwCode`/`curVersion` (or
        `downloadedVersion`) pair from /device/firmware/info. The app shows
        `description` on its update screen and `runTime` as the estimated
        update duration in minutes (new in NaviLink 2.04.00).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swCode, swVersion]
              properties:
                swCode:
                  type: integer
                  example: 33556241
                swVersion:
                  type: integer
                  example: 167837696
      responses:
        '200':
          description: Firmware detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      description:
                        type: string
                      modelNumber:
                        type: integer
                      modelType:
                        type: integer
                      productFamily:
                        type: integer
                      registerAt:
                        type: integer
                        format: int64
                        example: 1700000000000
                      runTime:
                        type: integer
                        example: 15
                        description: Estimated update duration in minutes
                      swCode:
                        type: integer
                        example: 33556241
                      swVersion:
                        type: integer
                        example: 167837696
components:
  schemas:
    SimpleResponse:
      type: object
      description: Response envelope of an endpoint that returns no data.
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: SUCCESS
    SignInResponse:
      type: object
      description: Returned by /user/sign-in and /user/secured-sign-in.
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: SUCCESS
        data:
          type: object
          properties:
            userInfo:
              type: object
              properties:
                userType:
                  type: string
                  example: "O"
                userFirstName:
                  type: string
                  example: "John"
                userLastName:
                  type: string
                  example: "Doe"
                userStatus:
                  type: string
                  example: "NORMAL"
                userSeq:
                  type: integer
                  example: 36283
            legal:
              type: array
              items:
                type: object
            token:
              type: object
              properties:
                idToken:
                  type: string
                accessToken:
                  type: string
                refreshToken:
                  type: string
                authenticationExpiresIn:
                  type: integer
                  example: 3600
                accessKeyId:
                  type: string
                secretKey:
                  type: string
                sessionToken:
                  type: string
                authorizationExpiresIn:
                  type: integer
                  example: 3600
    UserDeviceRequest:
      type: object
      required: [userId, macAddress, additionalValue]
      properties:
        userId:
          type: string
          example: "user@example.com"
        macAddress:
          type: string
          example: "04786332fca0"
        additionalValue:
          type: string
          example: "5322"
    PushSettings:
      type: object
      description: "Push-notification flags: 1 = on, 2 = off (reverse of the device's on/off flags). A flag the cloud does not report is absent."
      properties:
        isErrorAlarm:
          type: integer
          enum: [1, 2]
          example: 1
        isDescalingAlarm:
          type: integer
          enum: [1, 2]
          example: 1
        isEtcAlarm:
          type: integer
          enum: [1, 2]
          example: 1
    MaintenanceDateRequest:
      type: object
      required: [userId, macAddress, additionalValue, deviceType, maintenanceDate]
      properties:
        userId:
          type: string
          example: "user@example.com"
        macAddress:
          type: string
          example: "04786332fca0"
        additionalValue:
          type: string
          example: "5322"
        deviceType:
          type: integer
          example: 52
        maintenanceDate:
          type: string
          example: "2025-3-7"
          description: "YYYY-M-D without zero padding: the app concatenates its date picker's integers."
    MaintenanceHistoryRequest:
      type: object
      required: [userId, offset, count, macAddress, additionalValue]
      properties:
        userId:
          type: string
          example: "user@example.com"
        offset:
          type: integer
          example: 0
        count:
          type: integer
          example: 20
        macAddress:
          type: string
          example: "04786332fca0"
        additionalValue:
          type: string
          example: "5322"
    MaintenanceHistoryResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: SUCCESS
        data:
          type: array
          items:
            type: object
            properties:
              maintenanceDate:
                type: string
                example: "2025-3-7"
              registerAt:
                type: integer
                description: Read as an integer by the app; unit undocumented.
    DisplayPreferences:
      type: object
      properties:
        modelTypeCode:
          type: integer
          example: 1
        pressureDisplayFormat:
          type: string
          enum: [P, M]
          example: "P"
          description: P = psi, M = metric
        temperatureDisplayFormat:
          type: string
          enum: [F, C]
          example: "F"
    TOUInterval:
      type: object
      properties:
        week:
          type: integer
          example: 124
          description: >
            Days of week bitfield (62=weekdays, 65=weekend,
            127=all; Sun=1, Mon=2, ..., Sat=64)
        startHour:
          type: integer
          example: 0
        startMinute:
          type: integer
          example: 0
        endHour:
          type: integer
          example: 6
        endMinute:
          type: integer
          example: 59
        priceMin:
          type: integer
          example: 31794
          description: >
            Minimum price (divide by 10^decimalPoint)
        priceMax:
          type: integer
          example: 31794
          description: >
            Maximum price (divide by 10^decimalPoint)
        decimalPoint:
          type: integer
          example: 5
          description: >
            Decimal places for price (e.g., 5 = divide by
            100000)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
